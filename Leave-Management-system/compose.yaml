
services:
  db:
    image: mysql:8.0.46
    container_name: leave-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DOCKER_ROOT_PASSWORD:?Set MYSQL_DOCKER_ROOT_PASSWORD in PowerShell}
      MYSQL_DATABASE: leave_management
    ports:
      - "3307:3306"
    volumes:
      - leave_management_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: leave-management-api:1.2
    container_name: leave-management-compose-api
    ports:
      - "8082:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/leave_management
      DB_PASSWORD: ${MYSQL_DOCKER_ROOT_PASSWORD:?Set MYSQL_DOCKER_ROOT_PASSWORD in PowerShell}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in PowerShell}
    depends_on:
      db:
        condition: service_healthy

volumes:
  leave_management_data:
